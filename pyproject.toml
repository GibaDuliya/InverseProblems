[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-restore"
version = "0.1.0"
description = "VE bridge matching for paired image restoration"
requires-python = ">=3.9"
dependencies = ["torch>=2.4,<3", "numpy>=1.23,<2", "Pillow>=9.1", "PyYAML>=6", "tqdm>=4.66"]

[project.optional-dependencies]
eval = ["torchmetrics>=1.4,<2", "torch-fidelity>=0.3,<0.4", "lpips>=0.1.4,<0.2", "torchvision>=0.19"]
quality = ["pyiqa==0.1.13", "insightface==0.7.3", "onnxruntime>=1.17,<2", "opencv-python<4.12", "opencv-python-headless<4.12"]
sweep = ["tqdm>=4.66", "matplotlib>=3.7"]
test = ["pytest>=7"]
soc-jpeg = ["jpeglib>=1.0.2,<2"]

[project.scripts]
bridge-sweep = "bridge_restore.sweep:main"
bridge-grid = "bridge_restore.grid:main"
bridge-train = "bridge_restore.train:main"
bridge-evaluate = "bridge_restore.evaluate:main"
bridge-sample = "bridge_restore.sample:main"
bridge-soc-train = "bridge_soc.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
