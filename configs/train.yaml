# Paths are relative to the working directory. Change root before running.
seed: 42
output_dir: runs/celeba_abm

data:
  factory: bridge_restore.data.datasets:CelebADataset
  kwargs:
    root: data/celeba
    images_dir: img_align_celeba
    partition_file: list_eval_partition.txt
  image_size: 128
  crop_mode: center_square
  interpolation: bicubic
  antialias: true
  num_workers: 4

split:
  mode: official             # use list_eval_partition.txt directly

corruption:
  factory: bridge_restore.data.corruptions:JPEGCorruption
  kwargs:
    quality: 10
    subsampling: 2

model:
  mode: abm                  # change to bm and use a different output_dir
  channels: 64
  num_res_blocks: 1
  channel_mult: [1, 1, 2, 3, 4]
  attention_resolutions: [16, 8]
  num_heads: 4
  dropout: 0.1
  use_checkpoint: false

bridge:
  sigma_max: 0.5             # fixed pilot T for BM/ABM
  sigma_min: 0.001
  sigma_data: 0.5
  cov_xy: 0.0

training:
  batch_size: 16
  grad_accum_steps: 1
  max_steps: 10000
  lr: 0.0001
  weight_decay: 0.0
  precision: bfloat16
  device: cuda
  ema_decay: 0.999
  validation_interval: 500
  validation_batches: 10
  checkpoint_interval: 1000
  log_interval: 50

sampling:
  num_steps: 100
  start_offset: 0.0001       # absolute author-time offset below T
  clip_output: true

evaluation:
  enabled: true
  weights: ema
  unit: step                  # epoch validates at completed epoch boundaries
  interval: 500
  subset_size: 512             # null uses the entire validation split
  subset_seed: 42
  batch_size: 8
  metrics:
    psnr: {}
    ssim: {}
    lpips: {backbone: alex}
  selection_metric: lpips
  selection_mode: min
  input_baseline: true
  final_test: true
  test_subset_size: null

  visual_samples_path: configs/visual_samples/celeba_val.json
  test_visual_samples_path: configs/visual_samples/celeba_test.json
