# Run with python -m bridge_restore.sweep --config configs/celeba_bm_T_sweep.yaml
# max_updates: null uses one epoch; e.g. 500 caps each run.
times:
- 1.0
- 1.5
- 2.0
- 4.0
epochs: 1
max_updates: 500
experiment:
  seed: 42
  output_dir: runs/celeba_bm_T_sweep
  data:
    factory: bridge_restore.data.datasets:CelebADataset
    kwargs:
      root: data/celeba
      images_dir: img_align_celeba
      partition_file: list_eval_partition.txt
    image_size: 128
    crop_mode: center_square
    interpolation: bicubic
    antialias: true
    num_workers: 4
  split:
    mode: official
  corruption:
    factory: bridge_restore.data.corruptions:JPEGCorruption
    kwargs:
      quality: 10
      subsampling: 2
  model:
    mode: bm
    channels: 64
    num_res_blocks: 1
    channel_mult:
    - 1
    - 1
    - 2
    - 3
    - 4
    attention_resolutions:
    - 16
    - 8
    num_heads: 4
    dropout: 0.1
    use_checkpoint: false
  bridge:
    sigma_max: 0.5
    sigma_min: 0.001
    sigma_data: 0.5
    cov_xy: 0.0
  training:
    batch_size: 4
    grad_accum_steps: 4
    max_steps: 10000
    lr: 0.0001
    weight_decay: 0.0
    precision: float16
    device: cuda
    ema_decay: 0.999
    validation_interval: 500
    validation_batches: 10
    checkpoint_interval: 1000
    log_interval: 50
  sampling:
    num_steps: 100
    start_offset: 0.0001
    clip_output: true
  evaluation:
    enabled: false
    weights: ema
    unit: step
    interval: 500
    subset_size: 512
    subset_seed: 42
    batch_size: 4
    metrics:
      psnr: {}
      ssim: {}
      lpips:
        backbone: alex
    selection_metric: lpips
    selection_mode: min
    input_baseline: true
    final_test: false
    test_subset_size: 32
    visual_samples_path: configs/visual_samples/celeba_val.json
    test_visual_samples_path: configs/visual_samples/celeba_test.json
