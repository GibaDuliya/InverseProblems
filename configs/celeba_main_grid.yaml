# Main training grid: medium and small models.
times:
- 1.0
- 1.5
- 2.0
modes:
- bm
- abm
models:
  medium:
    channels: 64
    num_res_blocks: 2
  small:
    channels: 64
    num_res_blocks: 1
experiment:
  seed: 42
  output_dir: runs/celeba_main_5ep
  data:
    factory: bridge_restore.data.datasets:CelebADataset
    kwargs:
      root: data/celeba
      images_dir: img_align_celeba
      partition_file: list_eval_partition.txt
    image_size: 128
    crop_mode: center_square
    interpolation: bicubic
    antialias: true
    num_workers: 2
  split:
    mode: official
  corruption:
    factory: bridge_restore.data.corruptions:JPEGCorruption
    kwargs:
      quality: 10
      subsampling: 2
  model:
    mode: bm
    channels: 64
    num_res_blocks: 2
    channel_mult:
    - 1
    - 1
    - 2
    - 3
    - 4
    attention_resolutions:
    - 16
    - 8
    num_heads: 4
    dropout: 0.1
    use_checkpoint: false
  bridge:
    sigma_max: 1.0
    sigma_min: 0.001
    sigma_data: 0.5
    cov_xy: 0.0
  training:
    batch_size: 64
    grad_accum_steps: 1
    max_steps: null
    lr: 0.0001
    weight_decay: 0.0
    precision: bfloat16
    device: cuda
    ema_decay: 0.996005996001
    validation_interval: 500
    validation_batches: 10
    log_interval: 50
    max_epochs: 5
  sampling:
    num_steps: 100
    start_offset: 0.0001
    clip_output: true
  evaluation:
    enabled: true
    weights: ema
    unit: epoch
    interval: 1
    subset_size: 512
    subset_seed: 42
    batch_size: 8
    metrics:
      psnr: &id001 {}
      ssim: &id002 {}
      lpips: &id003
        backbone: alex
      arcface: &id004
        det_size: 320
        min_coverage: 0.9
      musiq: &id005
        batch_size: 1
    input_baseline: true
    test_subset_size: 4096
    visual_samples_path: configs/visual_samples/celeba_val.json
    test_visual_samples_path: configs/visual_samples/celeba_test.json
    criteria:
      lpips:
        metric: lpips
        mode: min
        test: true
      identity:
        metric: arcface
        mode: max
        test: true
    test_metrics:
      psnr: *id001
      ssim: *id002
      lpips: *id003
      arcface: *id004
      musiq: *id005
      fid: {}
      kid:
        subset_size: 1000
      observation_mse: {}
      observation_mae: {}
